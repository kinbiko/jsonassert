version: "2"
linters:
  # `standard` enables errcheck, govet, ineffassign, staticcheck, unused: https://golangci-lint.run/docs/linters/#all-linters
  default: standard
  # Linters explicitly enabled on top of `standard`: only those with deliberately configured thresholds below.
  enable:
    - dogsled
    - dupl
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - lll
    - misspell
    - nakedret
    - prealloc
    - whitespace
  # Not in `standard`; kept as a documented guard in case they're ever promoted, recording past rejections.
  disable:
    - wsl
    - godot
    - nlreturn
    - depguard
    - varnamelen  # This has too many false positives around indexes etc to be useful
  settings:
    dogsled:
      max-blank-identifiers: 2
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: false
    funlen:
      lines: 50
      statements: 40
    gocognit:
      min-complexity: 11
    goconst:
      min-len: 10
      min-occurrences: 3
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 64
    gocyclo:
      min-complexity: 10
    godox:
      keywords:
        - TODO
        - FIXME
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      line-length: 165
      tab-width: 4
    misspell:
      locale: US
    nakedret:
      max-func-lines: 0
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    staticcheck:
      # QF1008 keeps suggesting dropping the `tt.` prefix; to preserve the original Asserter API we're choosing to ignore this warning.
      checks:
        - all
        - -QF1008
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - errchkjson
          - forbidigo
          - funlen
          - gocognit
          - gocyclo
          - lll
          - mnd
          - staticcheck
          - testpackage
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    # `gci` deliberately unused ("conflicts with goimports"); import formatters live in this section since v2.
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/kinbiko/bugsnag
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
