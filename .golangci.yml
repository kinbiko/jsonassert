version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct # replaced by exhaustruct_v5
    - godot
    - gomodguard # replaced by gomodguard_v2
    - modernize
    - nlreturn
    - noinlineerr
    - testableexamples
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 50
      statements: 40
    gocognit:
      min-complexity: 11
    goconst:
      min-len: 10
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 64
    gocyclo:
      min-complexity: 10
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 165
      tab-width: 4
    misspell:
      locale: US
    nakedret:
      max-func-lines: 0
    unparam:
      check-exported: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - errcheck
          - errchkjson
          - forbidigo
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - gosmopolitan
          - lll
          - maintidx
          - mnd
          - paralleltest
          - staticcheck
          - testpackage
      - path: \.go
        linters:
          - err113

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kinbiko/bugsnag
